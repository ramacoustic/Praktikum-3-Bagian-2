<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
    * {
        box-sizing: border-box;
        padding: 0;
        fornt-family: Arial, Helvetica, sans-serif;
        }
        
        html, body {
          width: 100%
          height: 100%;
          background-color: lightgrey;
          }
          . wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
          }
          
          header {
            background: grey;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            border: 1px solid;
          }
          
          nav {
            background-color: white;
            padding: 15px;
            text-align: left;
            font-wight: bold;
            border: 1px solid;
          }
          
          .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
          }
          
          article {
            flex: 3;
            background-color: lightblue;
            padding: 15px
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            gap: 10px;
          }
          
          section {
            background-color: loghtblue;
            padding: 15px;
            border: 1px solid black;
            flex: 1;
            display: flex;
            align-items: center;
          }
          
          aside {
            flex: 1;
            background-color: lightblue;
            padding: 15px;
            border: 1px solid black;
          }
          
          footer {
            background-color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
          }
  </style>
  
</head>
<body>
  <div class="wrapper">
    <header>
      <img src="logo.png" alt="" width="150px">
      <p>ini websire ku</p>
    </header>
    
    <nav>
      nav
    </nav>
    
    <div class="main-content">
      <article>
        article
        <section>sec</section>
        <section>sec</section>
        <section>sec</section>
      </article>
      
      <aside>
        aside
      </aside>
    </div>
    
    <footer>
      
    </footer>
  </div>
</body>
</html>
